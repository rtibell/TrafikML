plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tibell.trafficml'
version = '0.1.0'
description = 'TrafficML backend: gathers Stockholm (VST) road traffic data (section speeds, section definitions, ' +
        'traffic messages) from trafiken.nu into a PostGIS-enabled PostgreSQL database for downstream ML use.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jtsVersion = '1.20.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Geo-spatial support: maps JTS geometries (Point / LineString) onto PostGIS columns.
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation "org.locationtech.jts:jts-core:${jtsVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// hibernate-spatial is not part of Spring Boot's managed dependency set, so pin it to the
// same version as the (Boot-managed) hibernate-core to avoid class-loading mismatches.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.hibernate.orm' && details.requested.name == 'hibernate-spatial') {
            details.useVersion(dependencyManagement.importedProperties['hibernate.version'])
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
